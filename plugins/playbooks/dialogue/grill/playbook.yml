version: 2
name: grill
description: 一問ずつ曖昧さを解消し、明示合意した決定と未決を返す
requires:
  - {plugin: ask-until-agreed, marketplace: grill}
contract:
  id: grill/grill
  version: 1
  states: [open, withdrawn]
  invocation: {input: object, output: object}
steps:
  - id: ask
    skill: ask-until-agreed
    purpose: 調査、対話、明示合意、結果保存を完了する
    provides: [status, decisions, open_questions, reason]
