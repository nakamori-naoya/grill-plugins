version: 2
name: grill
description: 一問ずつ曖昧さを解消し、明示合意した決定と未決を返す
inputs: [contract, version, topic, context, questions, references, output_to]
requires: []

steps:
  - id: investigate
    agent_work: invoking_agent
    purpose: 資料とコードを読み、答えが分かる論点と利用者の判断が要る論点を分ける
    needs: [contract, version, topic, context, questions, references]

  - id: ask
    agent_work: invoking_agent
    purpose: 答えで成果が変わる問いを一問ずつ推奨と理由を添えて問う

  - id: agree
    agent_work: invoking_agent
    purpose: 決定と未決の一覧へ明示の合意を得る

  - id: return
    agent_work: invoking_agent
    purpose: 決定と未決を返す
    needs: [output_to]
    provides: [status, decisions, open_questions, reason]
